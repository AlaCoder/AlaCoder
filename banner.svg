<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ala Daas, Cloud &amp; DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0614"/>
      <stop offset="0.55" stop-color="#2A1245"/>
      <stop offset="1" stop-color="#5A1A45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5D8F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF5D8F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC857" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <style>
      .syn{stroke:#4DE1FF;stroke-opacity:.28;stroke-width:1.2}
      .n{fill:#FF5D8F}
      .c{fill:#4DE1FF}
      .name{font:800 76px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#F4EEFF;letter-spacing:-1px}
      .role{font:600 26px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FF5D8F}
      .cmd{font:500 17px 'Consolas','Courier New',monospace;fill:#B9ABD3}
      .ok{fill:#43D98A}
      .pulse{animation:p 2.4s ease-in-out infinite}
      .pulse2{animation:p 2.4s ease-in-out .8s infinite}
      .pulse3{animation:p 2.4s ease-in-out 1.6s infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
      .blink{animation:b 1.1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      @media (prefers-reduced-motion:reduce){.pulse,.pulse2,.pulse3,.blink{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <!-- neural network on the right -->
  <g>
    <line class="syn" x1="760" y1="70" x2="860" y2="120"/>
    <line class="syn" x1="860" y1="120" x2="980" y2="80"/>
    <line class="syn" x1="860" y1="120" x2="920" y2="200"/>
    <line class="syn" x1="980" y1="80" x2="1090" y2="130"/>
    <line class="syn" x1="920" y1="200" x2="1090" y2="130"/>
    <line class="syn" x1="980" y1="80" x2="920" y2="200"/>
    <line class="syn" x1="760" y1="70" x2="800" y2="190"/>
    <line class="syn" x1="800" y1="190" x2="920" y2="200"/>
    <line class="syn" x1="1090" y1="130" x2="1150" y2="60"/>
    <line class="syn" x1="1090" y1="130" x2="1140" y2="215"/>
    <line class="syn" x1="980" y1="80" x2="1040" y2="30"/>

    <circle cx="860" cy="120" r="36" fill="url(#glow)" class="pulse"/>
    <circle cx="980" cy="80" r="30" fill="url(#glow)" class="pulse2"/>
    <circle cx="1090" cy="130" r="40" fill="url(#glowGold)" class="pulse3"/>

    <circle class="n" cx="760" cy="70" r="5"/>
    <circle class="n" cx="860" cy="120" r="9"/>
    <circle class="n" cx="980" cy="80" r="8"/>
    <circle class="c" cx="920" cy="200" r="6"/>
    <circle class="c" cx="800" cy="190" r="4"/>
    <circle fill="#FFC857" cx="1090" cy="130" r="10"/>
    <circle class="c" cx="1150" cy="60" r="4"/>
    <circle class="n" cx="1140" cy="215" r="5"/>
    <circle class="c" cx="1040" cy="30" r="3"/>

    <!-- travelling impulses -->
    <circle r="4" fill="#FFC857">
      <animateMotion dur="3s" repeatCount="indefinite" path="M760,70 L860,120 L980,80 L1090,130"/>
    </circle>
    <circle r="3.5" fill="#4DE1FF">
      <animateMotion dur="3.6s" begin="1s" repeatCount="indefinite" path="M800,190 L920,200 L1090,130 L1150,60"/>
    </circle>
    <circle r="3" fill="#FF5D8F">
      <animateMotion dur="2.8s" begin=".5s" repeatCount="indefinite" path="M860,120 L920,200 L1090,130 L1140,215"/>
    </circle>
  </g>

  <!-- text -->
  <text x="64" y="72" class="cmd">$ kubectl get engineer ala-daas  →  STATUS <tspan class="ok">Ready</tspan><tspan class="blink"> ▌</tspan></text>
  <text x="60" y="160" class="name">Ala Daas</text>
  <text x="64" y="204" class="role">Cloud &amp; DevOps Engineer</text>
</svg>
